<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hexis — Contextual Matrix Generator</title>
<link rel="canonical" href="https://hexis.center/generator/">
<meta name="description" content="Hexis Contextual Matrix Generator — Position any AI system across risk exposure and governance maturity to derive an activation posture.">
<meta property="og:title" content="Hexis — Contextual Matrix Generator">
<meta property="og:description" content="Open methodology and governance tools for positioning AI systems across exposure and maturity.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hexis.center/generator/">
<meta property="og:image" content="https://hexis.center/assets/og-hexis.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Hexis — Contextual Matrix Generator">
<meta name="twitter:description" content="Open methodology and governance tools for positioning AI systems across exposure and maturity.">
<meta name="twitter:image" content="https://hexis.center/assets/og-hexis.png">
<link rel="icon" href="/assets/favicon.ico">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --charcoal: #1C1E23;
    --brass:    #B2986C;
    --stone:    #686662;
    --paper:    #F8F7F5;
    --ink:      #1C1E23;
    --ink-soft: #444240;
    --ink-muted:#686662;
    --rule:     rgba(28,30,35,0.14);
    --rule-s:   rgba(28,30,35,0.08);
    --absent:   #dedad4;
    --adhoc:    #c4c2be;
    --structured:#8a8884;
    --continuous:var(--stone);
    --embedded: var(--charcoal);
    --cell-low:      rgba(28,30,35,0.02);
    --cell-moderate: rgba(28,30,35,0.04);
    --cell-elevated: rgba(28,30,35,0.065);
    --cell-high:     rgba(28,30,35,0.09);
    --dim: 0.28;
  }

  /* ── CONFIGURATOR UI ── */
  body { background: var(--paper); font-family: Arial, Helvetica, sans-serif; }

  .configurator {
    background: var(--charcoal); color: var(--paper);
    padding: 24px 32px; margin-bottom: 0;
    display: flex; gap: 32px; align-items: flex-end; flex-wrap: wrap;
  }

  .cfg-nav {
    width: 100%; margin-bottom: 4px;
  }
  .cfg-back {
    font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
    color: rgba(248,247,245,0.45); text-decoration: none;
    transition: color .15s;
  }
  .cfg-back:hover { color: rgba(248,247,245,0.8); }

  .cfg-title {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 16px; font-weight: 700; margin-bottom: 16px;
    width: 100%;
  }

  .cfg-group { display: flex; flex-direction: column; gap: 6px; min-width: 160px; }
  .cfg-label { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.6; }

  .cfg-select, .cfg-input {
    background: rgba(248,247,245,0.1); border: 1px solid rgba(248,247,245,0.2);
    color: var(--paper); font-family: Arial, Helvetica, sans-serif; font-size: 11px;
    padding: 7px 10px; letter-spacing: 0.04em;
    appearance: none; cursor: pointer;
  }

  .cfg-input { min-width: 220px; }
  .cfg-select:focus, .cfg-input:focus { outline: none; border-color: rgba(248,247,245,0.5); }

  .cfg-btn {
    background: var(--paper); color: var(--charcoal); border: none; cursor: pointer;
    font-family: Arial, Helvetica, sans-serif; font-size: 10px;
    letter-spacing: 0.1em; text-transform: uppercase;
    padding: 9px 20px; align-self: flex-end;
    transition: opacity .15s;
  }
  .cfg-btn:hover { opacity: 0.85; }
  .cfg-btn.print-btn {
    background: transparent; color: var(--paper);
    border: 1px solid rgba(248,247,245,0.3);
    margin-left: auto;
    transition: border-color .15s;
  }
  .cfg-btn.print-btn:hover { border-color: rgba(248,247,245,0.65); opacity: 1; }

  /* ── REPORT PAGE ── */
  .report-wrap {
    background: var(--paper); padding: 0;
    min-height: calc(100vh - 160px);
  }

  .page { width: 100%; max-width: 960px; margin: 0 auto; padding: 0 24px 48px; }

  /* Context banner */
  .context-banner {
    background: var(--charcoal); color: var(--paper);
    padding: 14px 20px; display: flex;
    justify-content: space-between; align-items: center;
    margin-bottom: 0;
  }
  .ctx-label { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.5; }
  .ctx-name { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; font-weight: 700; margin-top: 2px; }
  .ctx-right { text-align: right; }
  .ctx-coords { font-size: 11px; font-weight: 500; margin-top: 2px; }
  .ctx-dims { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; justify-content: flex-end; }
  .dim-tag {
    font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 2px 7px; font-weight: 500;
  }
  .dim-critical { background: rgba(248,247,245,0.9); color: var(--charcoal); }
  .dim-soft { background: rgba(248,247,245,0.12); color: rgba(248,247,245,0.85); border: 1px solid rgba(248,247,245,0.22); }
  .ctx-safeguard {
    display: inline-block; background: rgba(248,247,245,0.15); color: var(--paper);
    font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 2px 8px; margin-top: 4px; margin-left: 6px;
    font-weight: 500; border: 1px solid rgba(248,247,245,0.3);
  }
  .ctx-badge {
    display: inline-block; background: rgba(248,247,245,0.15); color: var(--paper);
    font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 2px 8px; margin-top: 5px;
    border: 1px solid rgba(248,247,245,0.25);
  }

  /* Header */
  .header {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-bottom: 2px solid var(--ink); padding: 18px 0 14px; margin-bottom: 28px;
  }
  .brand { font-family: Georgia, 'Times New Roman', serif; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted); }
  .title { font-family: Georgia, 'Times New Roman', serif; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
  .subtitle { font-size: 11px; color: var(--ink-muted); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 4px; }
  .version-tag { font-size: 10px; color: var(--ink-muted); letter-spacing: 0.1em; text-transform: uppercase; text-align: right; line-height: 1.6; }

  /* Matrix */
  .matrix-connector { font-size: 10px; color: var(--ink-muted); letter-spacing: 0.08em; font-style: italic; margin-bottom: 14px; padding-left: 2px; }
  .axis-x-label { text-align: center; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 10px; padding-left: 140px; }
  .axis-y-wrap { display: flex; align-items: stretch; gap: 12px; }
  .axis-y-label { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; display: flex; align-items: center; justify-content: center; width: 14px; }

  .grid { display: grid; grid-template-columns: 130px repeat(4, 1fr); border: 1.5px solid var(--ink); width: 100%; flex: 1; }

  .exp-h { padding: 10px 12px; text-align: center; border-left: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .exp-h:first-child { border-left: none; }
  .exp-dot { width: 8px; height: 8px; }
  .exp-label { font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; }
  .exp-h.dim { opacity: var(--dim); }
  .exp-h.lit { background: rgba(28,30,35,0.05); }

  .corner { border-bottom: 1.5px solid var(--ink); padding: 10px; display: flex; align-items: flex-end; }
  .corner span { font-size: 9px; color: var(--ink-muted); letter-spacing: 0.06em; }

  .mat-h { padding: 0 12px; border-right: 1.5px solid var(--ink); border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; justify-content: center; gap: 2px; min-height: 84px; }
  .mat-h.dim { opacity: var(--dim); }
  .mat-h.lit { background: rgba(28,30,35,0.04); border-right-color: var(--charcoal); }
  .mat-level { font-size: 11px; font-weight: 500; letter-spacing: 0.04em; }
  .mat-bar { height: 3px; margin-top: 5px; width: 60%; }

  .cell { padding: 10px 12px; border-left: 1px solid var(--rule); border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; justify-content: center; min-height: 84px; position: relative; }
  .cell.dim { opacity: var(--dim); }
  .cell.focal { background: rgba(28,30,35,0.07) !important; border: 2px solid var(--charcoal) !important; z-index: 2; }
  .cell.focal .c-action { color: var(--charcoal); font-weight: 700; font-size: 11px; }
  .cell.focal .c-tag { color: var(--ink-soft); }
  .cell.focal .u-bar { width: 5px; background: var(--charcoal) !important; }

  .focal-pin { position: absolute; top: 7px; right: 7px; width: 10px; height: 10px; background: var(--charcoal); display: flex; align-items: center; justify-content: center; }
  .focal-pin::after { content: ''; width: 4px; height: 4px; background: var(--paper); }

  .u-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .urg-critical { background: var(--charcoal); }
  .urg-high     { background: #444240; }
  .urg-moderate { background: var(--stone); }
  .urg-low      { background: #8a8884; }
  .urg-minimal  { background: #c4c2be; }

  .col-low      { background: var(--cell-low); }
  .col-moderate { background: var(--cell-moderate); }
  .col-elevated { background: var(--cell-elevated); }
  .col-high     { background: var(--cell-high); }
  .row-last .cell, .row-last .mat-h { border-bottom: none; }
  .c-action { font-size: 10.5px; font-weight: 500; line-height: 1.4; letter-spacing: 0.01em; }
  .c-tag { font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); margin-top: 5px; }
  .bar-absent     { background: var(--absent); }
  .bar-adhoc      { background: var(--adhoc); }
  .bar-structured { background: var(--structured); }
  .bar-continuous { background: var(--continuous); }
  .bar-embedded   { background: var(--embedded); }

  /* Exposure dot tones */
  .dot-low      { background: rgba(28,30,35,0.12); }
  .dot-moderate { background: rgba(28,30,35,0.28); }
  .dot-elevated { background: rgba(28,30,35,0.50); }
  .dot-high     { background: var(--charcoal); }

  /* Why this position */
  .why-section {
    margin-top: 20px; border: 1px solid var(--rule);
    padding: 16px 20px; background: var(--paper);
  }
  .why-label {
    font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-muted); margin-bottom: 8px;
  }
  .why-text {
    font-size: 11px; line-height: 1.7; color: var(--ink-soft);
    font-family: Georgia, 'Times New Roman', serif; font-style: italic;
  }
  .why-loading { color: var(--ink-muted); font-style: italic; font-size: 10px; }
  .why-error { color: var(--stone); font-size: 10px; font-style: normal; }

  /* Callout */
  .callout { margin-top: 20px; border: 1.5px solid var(--charcoal); display: flex; overflow: hidden; }
  .callout-stripe { width: 4px; background: var(--charcoal); flex-shrink: 0; }
  .callout-inner { padding: 14px 18px; display: flex; gap: 28px; flex: 1; align-items: flex-start; }
  .co-sec { flex: 1; }
  .co-label { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 4px; }
  .co-val { font-size: 11px; font-weight: 500; line-height: 1.5; }
  .co-div { width: 1px; background: var(--rule); align-self: stretch; }

  .weight-note { font-size: 9px; color: var(--ink-muted); letter-spacing: 0.06em; margin-top: 14px; padding: 8px 12px; border-left: 2px solid var(--rule); line-height: 1.6; }
  .footer { display: flex; justify-content: space-between; align-items: flex-start; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--rule); }
  .legend { display: flex; gap: 20px; }
  .leg-item { display: flex; align-items: center; gap: 6px; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); }
  .leg-dot { width: 8px; height: 8px; flex-shrink: 0; }
  .footnote { font-size: 9px; color: var(--ink-muted); letter-spacing: 0.06em; text-align: right; line-height: 1.6; max-width: 280px; }


  /* ── REPORT LOGO (visible in print, hidden on screen) ── */
  .report-logo {
    display: none; /* screen: logo already in context-banner area; show only in print */
  }

  /* ── PRINT STYLESHEET ── */
  @media print {
    .configurator { display: none !important; }
    .report-logo {
      display: block;
      margin-bottom: 12px;
    }
    .report-logo img {
      max-height: 22px;
      width: auto;
      height: auto;
    }

    body { background: white !important; padding: 0; margin: 0; }
    .report-wrap { background: white !important; min-height: unset; }
    .page { max-width: 100% !important; padding: 0 !important; }

    /* Preserve color in print */
    .context-banner, .cell, .exp-h, .mat-h,
    .callout-stripe, .why-section, .dim-tag,
    .ctx-badge, .ctx-safeguard,
    .mat-bar, .u-bar {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* Page break control */
    .callout      { page-break-inside: avoid; }
    .why-section  { page-break-inside: avoid; }
    .grid         { page-break-inside: avoid; }
    .footer       { page-break-inside: avoid; }

    /* A4 font scaling */
    .c-action     { font-size: 10px; }
    .c-tag        { font-size: 8px; }
    .cell, .mat-h { min-height: 72px; }
    .weight-note  { font-size: 8px; }
    .footer       { margin-top: 12px; }

    a[href]:after { content: none !important; }
  }

  @page {
    size: A4;
    margin: 18mm 16mm;
  }

  /* ── RISK CLASSIFIER WIZARD ── */
  .classifier-wrap {
    background: var(--paper); border-bottom: 1.5px solid var(--ink);
  }
  .classifier {
    max-width: 960px; margin: 0 auto; padding: 28px 24px 32px;
  }
  .clf-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 20px;
  }
  .clf-brand { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 4px; }
  .clf-title { font-family: Georgia, 'Times New Roman', serif; font-size: 18px; font-weight: 700; color: var(--ink); line-height: 1.2; }
  .clf-subtitle { font-size: 11px; color: var(--ink-muted); margin-top: 4px; letter-spacing: 0.04em; }
  .clf-skip {
    font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-muted); text-decoration: none; cursor: pointer;
    border: 1px solid var(--rule); padding: 6px 14px; background: none;
    font-family: Arial, Helvetica, sans-serif; transition: all .15s;
    white-space: nowrap; margin-top: 4px;
  }
  .clf-skip:hover { border-color: var(--ink); color: var(--ink); }

  .clf-progress { display: flex; gap: 3px; margin-bottom: 24px; }
  .clf-prog-seg { height: 2px; flex: 1; background: var(--rule); transition: background .3s; }
  .clf-prog-seg.active { background: var(--charcoal); }
  .clf-prog-seg.done { background: var(--stone); }

  .clf-question { margin-bottom: 24px; display: none; }
  .clf-question.active { display: block; }
  .clf-q-num { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 6px; }
  .clf-q-text { font-family: Georgia, 'Times New Roman', serif; font-size: 15px; font-weight: 700; color: var(--ink); line-height: 1.4; margin-bottom: 6px; }
  .clf-q-hint { font-size: 11px; color: var(--stone); line-height: 1.5; margin-bottom: 16px; font-style: italic; }

  .clf-options { display: flex; flex-direction: column; gap: 6px; }
  .clf-opt {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 16px; border: 1px solid var(--rule);
    cursor: pointer; transition: all .15s; background: transparent;
    text-align: left; font-family: Arial, Helvetica, sans-serif;
  }
  .clf-opt:hover { border-color: var(--stone); background: rgba(28,30,35,0.015); }
  .clf-opt.selected { border-color: var(--charcoal); background: rgba(28,30,35,0.04); }
  .clf-opt-radio {
    width: 14px; height: 14px; border: 1.5px solid var(--stone);
    flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center;
  }
  .clf-opt.selected .clf-opt-radio { border-color: var(--charcoal); }
  .clf-opt.selected .clf-opt-radio::after { content: ''; width: 7px; height: 7px; background: var(--charcoal); }
  .clf-opt-text { flex: 1; }
  .clf-opt-label { font-size: 12px; font-weight: 500; color: var(--ink); line-height: 1.3; }
  .clf-opt-desc { font-size: 10px; color: var(--stone); margin-top: 2px; line-height: 1.4; }

  .clf-nav {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--rule);
  }
  .clf-btn-back {
    font-size: 10px; letter-spacing: 0.08em; color: var(--stone);
    background: none; border: none; cursor: pointer; padding: 8px 0;
    font-family: Arial, Helvetica, sans-serif; transition: color .15s;
  }
  .clf-btn-back:hover { color: var(--ink); }
  .clf-btn-back.hidden { visibility: hidden; }
  .clf-btn-next {
    background: var(--charcoal); color: var(--paper); border: none;
    padding: 9px 22px; font-size: 10px; letter-spacing: 0.1em;
    text-transform: uppercase; cursor: pointer;
    font-family: Arial, Helvetica, sans-serif; transition: opacity .15s;
  }
  .clf-btn-next:hover { opacity: 0.85; }
  .clf-btn-next:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Result card */
  .clf-result { display: none; border: 1.5px solid var(--charcoal); }
  .clf-result.visible { display: block; }
  .clf-result-header {
    background: var(--charcoal); color: var(--paper); padding: 16px 20px;
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .clf-result-cat { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.6; }
  .clf-result-level { font-family: Georgia, 'Times New Roman', serif; font-size: 18px; font-weight: 700; margin-top: 4px; }
  .clf-result-ref { font-size: 11px; opacity: 0.7; margin-top: 2px; }
  .clf-result-deadline { text-align: right; font-size: 10px; letter-spacing: 0.06em; }
  .clf-result-days { font-family: Georgia, 'Times New Roman', serif; font-size: 22px; font-weight: 700; margin-top: 2px; }
  .clf-result-body { padding: 16px 20px; }
  .clf-result-section { margin-bottom: 14px; }
  .clf-result-label { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 6px; }
  .clf-result-obligations { display: flex; flex-direction: column; gap: 4px; }
  .clf-result-obl {
    font-size: 11px; color: var(--ink-soft); line-height: 1.5;
    padding-left: 12px; position: relative;
  }
  .clf-result-obl::before { content: '·'; position: absolute; left: 2px; color: var(--stone); font-weight: 700; }
  .clf-result-actions {
    display: flex; gap: 10px; margin-top: 16px; padding-top: 14px;
    border-top: 1px solid var(--rule);
  }
  .clf-result-continue {
    background: var(--charcoal); color: var(--paper); border: none;
    padding: 10px 24px; font-size: 10px; letter-spacing: 0.1em;
    text-transform: uppercase; cursor: pointer;
    font-family: Arial, Helvetica, sans-serif; transition: opacity .15s;
  }
  .clf-result-continue:hover { opacity: 0.85; }
  .clf-result-restart {
    background: none; color: var(--stone); border: 1px solid var(--rule);
    padding: 10px 18px; font-size: 10px; letter-spacing: 0.1em;
    text-transform: uppercase; cursor: pointer;
    font-family: Arial, Helvetica, sans-serif; transition: all .15s;
  }
  .clf-result-restart:hover { border-color: var(--ink); color: var(--ink); }
  .classifier-wrap.collapsed { display: none; }
  @media print { .classifier-wrap { display: none !important; } }
</style>
</head>
<body>

<!-- ── EU AI ACT RISK CLASSIFIER ── -->
<div class="classifier-wrap" id="classifier-wrap">
  <div class="classifier">
    <div class="clf-header">
      <div>
        <div class="clf-brand">Hexis · EU AI Act Risk Classifier</div>
        <div class="clf-title">Classify Your AI System</div>
        <div class="clf-subtitle">Answer 6 questions to determine your EU AI Act risk category and legal obligations</div>
      </div>
      <button class="clf-skip" onclick="skipClassifier()">I know my risk level →</button>
    </div>
    <div class="clf-progress" id="clf-progress"></div>
    <div id="clf-questions"></div>
    <div class="clf-nav" id="clf-nav">
      <button class="clf-btn-back hidden" id="clf-back" onclick="clfBack()">← Back</button>
      <button class="clf-btn-next" id="clf-next" onclick="clfNext()" disabled>Next →</button>
    </div>
    <div class="clf-result" id="clf-result"></div>
  </div>
</div>

<!-- ── CONFIGURATOR ── -->
<div class="configurator">
  <div class="cfg-nav">
    <a href="/" class="cfg-back">← hexis.center</a>
  </div>
  <div class="cfg-title">Hexis · Contextual Matrix Generator</div>

  <div class="cfg-group">
    <div class="cfg-label">System Name</div>
    <input class="cfg-input" id="cfg-name" type="text" value="HR Candidate Pre-Screening System" placeholder="System name...">
  </div>

  </div>

  <div class="cfg-group">
    <div class="cfg-label">Monitoring</div>
    <select class="cfg-select" id="cfg-monitoring">
      <option value="absent" selected>Absent</option>
      <option value="adhoc">Ad Hoc</option>
      <option value="structured">Structured</option>

  <div class="cfg-group">

      <option value="absent">Absent</option>

      <option value="continuous">Continuous</option>

  <button class="cfg-btn print-btn" onclick="window.print()">Export PDF</button>
</div>

<div class="report-wrap">
  <div id="report-output"></div>
</div>

<script>
// ── RISK CLASSIFIER WIZARD ENGINE ──
(function() {
  'use strict';

  var CLF_TOTAL_STEPS = 6;

  var CLF_QUESTIONS = [
    {
      num: 'Step 1 of 6',
      text: 'Does your AI system involve any prohibited practice?',
      hint: 'Article 5 of the EU AI Act prohibits certain AI practices that pose unacceptable risk. If any apply, the system cannot be placed on the EU market.',
      options: [
        { id: 'social_scoring', label: 'Social scoring by public authorities', desc: 'Evaluating or classifying persons based on social behavior or personality characteristics leading to detrimental treatment', article: 'Article 5(1)(c)', terminates: true },
        { id: 'realtime_biometric', label: 'Real-time remote biometric identification in publicly accessible spaces', desc: 'For law enforcement purposes, except narrow exceptions under Article 5(2)', article: 'Article 5(1)(h)', terminates: true },
        { id: 'emotion_recognition', label: 'Emotion recognition in workplace or education', desc: 'Inferring emotions of natural persons in workplace and educational settings', article: 'Article 5(1)(f)', terminates: true },
        { id: 'facial_scraping', label: 'Untargeted scraping of facial images', desc: 'From the internet or CCTV footage to build or expand facial recognition databases', article: 'Article 5(1)(e)', terminates: true },
        { id: 'subliminal', label: 'Subliminal, manipulative or deceptive techniques', desc: 'Materially distorting behaviour of persons, causing or likely to cause significant harm', article: 'Article 5(1)(a)', terminates: true },
        { id: 'vulnerability', label: 'Exploiting vulnerabilities of specific groups', desc: 'Targeting persons due to age, disability, or social/economic situation to distort their behaviour', article: 'Article 5(1)(b)', terminates: true },
        { id: 'predictive_policing', label: 'Individual predictive policing based solely on profiling', desc: 'Risk assessments predicting criminal offences based solely on profiling or personality traits', article: 'Article 5(1)(d)', terminates: true },
        { id: 'biometric_cat', label: 'Biometric categorisation inferring sensitive attributes', desc: 'Categorising persons to deduce race, political opinions, trade union membership, religious beliefs, sex life or sexual orientation', article: 'Article 5(1)(g)', terminates: true },
        { id: 'none', label: 'None of the above', desc: 'My system does not involve any prohibited practice' }
      ]
    },
    {
      num: 'Step 2 of 6',
      text: 'Is your AI system a safety component of, or itself a product covered by EU harmonisation legislation listed in Annex I?',
      hint: 'Annex I covers product safety legislation including machinery, medical devices, toys, lifts, radio equipment, civil aviation, motor vehicles, and marine equipment.',
      options: [
        { id: 'yes', label: 'Yes — covered by Annex I product safety legislation', desc: 'The AI system is embedded in or constitutes a product regulated under existing EU product safety law' },
        { id: 'no', label: 'No', desc: 'The system is not a safety component of any Annex I product' }
      ]
    },
    {
      num: 'Step 3 of 6',
      text: 'Does your AI system fall within any high-risk area listed in Annex III?',
      hint: 'Article 6(2) designates AI systems in these domains as high-risk when they pose significant risks to health, safety, or fundamental rights.',
      options: [
        { id: 'area1', label: '1. Biometrics', desc: 'Remote biometric identification (not prohibited under Art. 5), biometric categorisation by sensitive attributes', area: 1 },
        { id: 'area2', label: '2. Critical infrastructure', desc: 'Safety components of road traffic, water, gas, heating and electricity supply management', area: 2 },
        { id: 'area3', label: '3. Education and vocational training', desc: 'Determining access to education, assessing learning outcomes, monitoring prohibited behaviour during tests', area: 3 },
        { id: 'area4', label: '4. Employment and worker management', desc: 'Recruitment, CV screening, promotion decisions, task allocation, monitoring and evaluating workers', area: 4 },
        { id: 'area5', label: '5. Essential private and public services', desc: 'Credit scoring, insurance risk assessment, emergency services dispatch, social benefit eligibility', area: 5 },
        { id: 'area6', label: '6. Law enforcement', desc: 'Individual risk assessment, polygraph and lie detection, evidence reliability assessment, reoffending risk', area: 6 },
        { id: 'area7', label: '7. Migration, asylum and border control', desc: 'Risk assessment, application processing, verification of authenticity of travel documents', area: 7 },
        { id: 'area8', label: '8. Administration of justice and democratic processes', desc: 'Assisting judicial authorities in researching and interpreting facts and law, alternative dispute resolution', area: 8 },
        { id: 'none', label: 'None of the above', desc: 'My system does not fall within any Annex III high-risk area' }
      ]
    },
    {
      num: 'Step 4 of 6',
      text: 'Does your AI system have transparency obligations under Article 50?',
      hint: 'Certain AI systems must ensure that users are informed they are interacting with AI, or that content is AI-generated.',
      options: [
        { id: 'deepfake', label: 'Generates or manipulates image, audio or video content', desc: 'Deepfakes, synthetic media, AI-generated content that resembles real persons, objects, places or events' },
        { id: 'chatbot', label: 'Interacts directly with natural persons', desc: 'Chatbots, virtual assistants, or other systems where persons may not realise they are interacting with AI' },
        { id: 'public_content', label: 'Generates text used to inform the public', desc: 'AI-generated text published to inform the public on matters of public interest' },
        { id: 'none', label: 'No transparency obligations apply', desc: 'The system does not fall into any Article 50 transparency category' }
      ]
    },
    {
      num: 'Step 5 of 6',
      text: 'Is this a general-purpose AI (GPAI) model?',
      hint: 'General-purpose AI models are trained with large amounts of data using self-supervision at scale, capable of competently performing a wide range of distinct tasks (Articles 51\u201356).',
      options: [
        { id: 'gpai_provider', label: 'Yes — I am a provider of a GPAI model', desc: 'You develop and make available a general-purpose AI model (Art. 51\u201353)' },
        { id: 'gpai_systemic', label: 'Yes — GPAI model with systemic risk', desc: 'GPAI model with high-impact capabilities, trained with total compute \u2265 10\u00B2\u2075 FLOPs (Art. 51\u201355)' },
        { id: 'gpai_deployer', label: 'Yes — I deploy a system built on a GPAI model', desc: 'You use a GPAI model as part of your AI system. Provider obligations apply to the GPAI provider.' },
        { id: 'none', label: 'No — not a general-purpose AI model', desc: 'This is a task-specific or narrow AI system' }
      ]
    },
    {
      num: 'Step 6 of 6',
      text: 'Is your AI system likely to have a significant impact on fundamental rights?',
      hint: 'Article 27 requires deployers of high-risk AI systems to carry out a fundamental rights impact assessment (FRIA) before putting a system into use.',
      options: [
        { id: 'yes', label: 'Yes — significant impact on fundamental rights likely', desc: 'The system may affect the right to non-discrimination, privacy, freedom of expression, human dignity, or other fundamental rights' },
        { id: 'no', label: 'No significant impact expected', desc: 'The system does not pose significant risks to fundamental rights' }
      ]
    }
  ];

  var HIGH_RISK_OBLIGATIONS = [
    'Risk management system (Art. 9)',
    'Data governance and management (Art. 10)',
    'Technical documentation (Art. 11)',
    'Record-keeping and logging (Art. 12)',
    'Transparency and provision of information to deployers (Art. 13)',
    'Human oversight measures (Art. 14)',
    'Accuracy, robustness and cybersecurity (Art. 15)',
    'Conformity assessment before placing on market (Art. 43)'
  ];

  var GPAI_OBLIGATIONS = [
    'Technical documentation for the model (Art. 53(1)(a))',
    'Information and documentation to downstream providers (Art. 53(1)(b))',
    'Copyright policy and compliance (Art. 53(1)(c))',
    'Publish sufficiently detailed summary of training content (Art. 53(1)(d))'
  ];

  var GPAI_SYSTEMIC_OBLIGATIONS = GPAI_OBLIGATIONS.concat([
    'Model evaluation including adversarial testing (Art. 55(1)(a))',
    'Assess and mitigate systemic risks (Art. 55(1)(b))',
    'Track, document and report serious incidents (Art. 55(1)(c))',
    'Ensure adequate level of cybersecurity (Art. 55(1)(d))'
  ]);

  var TRANSPARENCY_OBLIGATIONS = [
    'Inform natural persons they are interacting with an AI system (Art. 50(1))',
    'Mark AI-generated or manipulated content as artificially generated (Art. 50(2))',
    'Label deepfake content with machine-readable disclosure (Art. 50(4))'
  ];

  var MINIMAL_OBLIGATIONS = [
    'Voluntary codes of conduct encouraged (Art. 95)',
    'Consider implementing transparency measures',
    'Monitor EU AI Act regulatory developments for reclassification triggers'
  ];

  var clfCurrentStep = 0;
  var clfSelections = {};

  function initClassifier() {
    var progressEl = document.getElementById('clf-progress');
    if (!progressEl) return;
    progressEl.innerHTML = '';
    for (var i = 0; i < CLF_TOTAL_STEPS; i++) {
      var seg = document.createElement('div');
      seg.className = 'clf-prog-seg';
      seg.dataset.step = i;
      progressEl.appendChild(seg);
    }

    var questionsEl = document.getElementById('clf-questions');
    if (!questionsEl) return;
    questionsEl.innerHTML = '';

    CLF_QUESTIONS.forEach(function(q, idx) {
      var div = document.createElement('div');
      div.className = 'clf-question';
      div.id = 'clf-step-' + idx;

      var optionsHtml = q.options.map(function(opt) {
        return '<button class="clf-opt" data-step="' + idx + '" data-option="' + opt.id + '" onclick="clfSelectOption(' + idx + ',\'' + opt.id + '\')">' +
          '<div class="clf-opt-radio"></div>' +
          '<div class="clf-opt-text">' +
            '<div class="clf-opt-label">' + opt.label + '</div>' +
            '<div class="clf-opt-desc">' + opt.desc + '</div>' +
          '</div>' +
        '</button>';
      }).join('');

      div.innerHTML =
        '<div class="clf-q-num">' + q.num + '</div>' +
        '<div class="clf-q-text">' + q.text + '</div>' +
        '<div class="clf-q-hint">' + q.hint + '</div>' +
        '<div class="clf-options">' + optionsHtml + '</div>';

      questionsEl.appendChild(div);
    });

    clfCurrentStep = 0;
    clfSelections = {};
    renderClfStep();
  }

  function renderClfStep() {
    document.querySelectorAll('.clf-prog-seg').forEach(function(seg, i) {
      seg.classList.toggle('active', i === clfCurrentStep);
      seg.classList.toggle('done', i < clfCurrentStep);
    });

    document.querySelectorAll('.clf-question').forEach(function(q, i) {
      q.classList.toggle('active', i === clfCurrentStep);
    });

    var backBtn = document.getElementById('clf-back');
    var nextBtn = document.getElementById('clf-next');
    var navEl = document.getElementById('clf-nav');

    if (backBtn) backBtn.classList.toggle('hidden', clfCurrentStep === 0);

    if (nextBtn) {
      var isLast = clfCurrentStep === CLF_TOTAL_STEPS - 1;
      nextBtn.textContent = isLast ? 'See Result \u2192' : 'Next \u2192';
      nextBtn.disabled = !clfSelections[clfCurrentStep];
    }

    if (navEl) navEl.style.display = 'flex';
    var resultEl = document.getElementById('clf-result');
    if (resultEl) resultEl.classList.remove('visible');

    document.querySelectorAll('#clf-step-' + clfCurrentStep + ' .clf-opt').forEach(function(opt) {
      opt.classList.toggle('selected', opt.dataset.option === clfSelections[clfCurrentStep]);
    });
  }

  function daysUntil(dateStr) {
    var target = new Date(dateStr + 'T00:00:00');
    var now = new Date();
    now.setHours(0, 0, 0, 0);
    return Math.ceil((target - now) / 86400000);
  }

  function showProhibitedResult(option) {
    var navEl = document.getElementById('clf-nav');
    if (navEl) navEl.style.display = 'none';

    document.querySelectorAll('.clf-prog-seg').forEach(function(seg) {
      seg.classList.add('done');
      seg.classList.remove('active');
    });
    document.querySelectorAll('.clf-question').forEach(function(q) { q.classList.remove('active'); });

    var days = daysUntil('2025-02-02');
    var deadlineText = days <= 0 ? 'IN FORCE' : days + ' days';

    var resultEl = document.getElementById('clf-result');
    resultEl.innerHTML =
      '<div class="clf-result-header">' +
        '<div>' +
          '<div class="clf-result-cat">Unacceptable Risk</div>' +
          '<div class="clf-result-level">PROHIBITED</div>' +
          '<div class="clf-result-ref">' + option.article + ' \u2014 Regulation (EU) 2024/1689</div>' +
        '</div>' +
        '<div class="clf-result-deadline">' +
          '<div>Enforcement</div>' +
          '<div class="clf-result-days">' + deadlineText + '</div>' +
          '<div>since 2 February 2025</div>' +
        '</div>' +
      '</div>' +
      '<div class="clf-result-body">' +
        '<div class="clf-result-section">' +
          '<div class="clf-result-label">Classification</div>' +
          '<div class="clf-result-obligations">' +
            '<div class="clf-result-obl">This AI practice is prohibited under the EU AI Act</div>' +
            '<div class="clf-result-obl">System cannot be placed on the market or put into service in the EU</div>' +
            '<div class="clf-result-obl">Must be withdrawn from the EU market if already deployed</div>' +
          '</div>' +
        '</div>' +
        '<div class="clf-result-section">' +
          '<div class="clf-result-label">Penalty</div>' +
          '<div class="clf-result-obligations">' +
            '<div class="clf-result-obl">Up to \u20AC35 million or 7% of total worldwide annual turnover, whichever is higher</div>' +
            '<div class="clf-result-obl">SMEs and startups: same amounts but whichever is lower (Art. 99(6))</div>' +
          '</div>' +
        '</div>' +
        '<div class="clf-result-actions">' +
          '<button class="clf-result-restart" onclick="restartClassifier()">\u21BB Reclassify</button>' +
        '</div>' +
      '</div>';
    resultEl.classList.add('visible');
  }

  function computeClassification() {
    var step2 = clfSelections[1];
    var step3 = clfSelections[2];
    var step4 = clfSelections[3];
    var step5 = clfSelections[4];
    var step6 = clfSelections[5];

    var isAnnexI = step2 === 'yes';
    var isAnnexIII = step3 && step3 !== 'none';
    var annexIIIOption = isAnnexIII ? CLF_QUESTIONS[2].options.find(function(o) { return o.id === step3; }) : null;
    var annexIIIArea = annexIIIOption ? annexIIIOption.area : null;
    var hasTransparency = step4 && step4 !== 'none';
    var isGPAI = step5 === 'gpai_provider';
    var isGPAISystemic = step5 === 'gpai_systemic';
    var isGPAIDeployer = step5 === 'gpai_deployer';
    var hasFRIA = step6 === 'yes';

    var level, category, articles, deadline, deadlineLabel, obligations, penalty, exposureMapping;
    var supplementary = [];

    if (isAnnexIII) {
      level = 'HIGH RISK';
      category = 'Annex III \u2014 Area ' + annexIIIArea;
      articles = 'Article 6(2), Annex III Area ' + annexIIIArea;
      deadline = '2026-08-02';
      deadlineLabel = '2 August 2026';
      obligations = HIGH_RISK_OBLIGATIONS.slice();
      penalty = 'Up to \u20AC15 million or 3% of total worldwide annual turnover, whichever is higher';
      exposureMapping = 'high';
      if (isAnnexI) {
        supplementary.push('Also covered by Annex I product safety legislation (Art. 6(1)) \u2014 additional deadline 2 August 2027');
      }
    } else if (isAnnexI) {
      level = 'HIGH RISK';
      category = 'Annex I \u2014 Product Safety Legislation';
      articles = 'Article 6(1), Annex I';
      deadline = '2027-08-02';
      deadlineLabel = '2 August 2027';
      obligations = HIGH_RISK_OBLIGATIONS.slice();
      penalty = 'Up to \u20AC15 million or 3% of total worldwide annual turnover, whichever is higher';
      exposureMapping = 'high';
    } else if (isGPAISystemic) {
      level = 'GENERAL-PURPOSE AI';
      category = 'Systemic Risk \u2014 Chapter V';
      articles = 'Articles 51\u201355';
      deadline = '2025-08-02';
      deadlineLabel = '2 August 2025';
      obligations = GPAI_SYSTEMIC_OBLIGATIONS.slice();
      penalty = 'Up to \u20AC15 million or 3% of total worldwide annual turnover, whichever is higher';
      exposureMapping = 'high';
    } else if (isGPAI) {
      level = 'GENERAL-PURPOSE AI';
      category = 'Provider Obligations \u2014 Chapter V';
      articles = 'Articles 51\u201353';
      deadline = '2025-08-02';
      deadlineLabel = '2 August 2025';
      obligations = GPAI_OBLIGATIONS.slice();
      penalty = 'Up to \u20AC15 million or 3% of total worldwide annual turnover, whichever is higher';
      exposureMapping = 'elevated';
    } else if (hasTransparency) {
      level = 'LIMITED RISK';
      category = 'Transparency Obligations';
      articles = 'Article 50';
      deadline = '2026-08-02';
      deadlineLabel = '2 August 2026';
      obligations = TRANSPARENCY_OBLIGATIONS.slice();
      penalty = 'Up to \u20AC7.5 million or 1% of total worldwide annual turnover, whichever is higher';
      exposureMapping = 'moderate';
    } else {
      level = 'MINIMAL RISK';
      category = 'Voluntary Compliance';
      articles = 'Article 95';
      deadline = null;
      deadlineLabel = null;
      obligations = MINIMAL_OBLIGATIONS.slice();
      penalty = null;
      exposureMapping = 'low';
    }

    if (hasTransparency && level !== 'LIMITED RISK') {
      supplementary.push('Transparency obligations also apply (Art. 50)');
    }
    if (hasFRIA && (isAnnexI || isAnnexIII)) {
      supplementary.push('Fundamental Rights Impact Assessment required before deployment (Art. 27)');
    }
    if ((isGPAI || isGPAISystemic) && (isAnnexI || isAnnexIII)) {
      supplementary.push('GPAI provider obligations also apply (Art. 51\u201353)');
    }
    if (isGPAIDeployer) {
      supplementary.push('GPAI model provider bears separate obligations under Art. 51\u201353');
    }

    return {
      level: level, category: category, articles: articles,
      deadline: deadline, deadlineLabel: deadlineLabel,
      obligations: obligations, penalty: penalty,
      exposureMapping: exposureMapping, supplementary: supplementary
    };
  }

  function showClassificationResult() {
    var navEl = document.getElementById('clf-nav');
    if (navEl) navEl.style.display = 'none';

    document.querySelectorAll('.clf-prog-seg').forEach(function(seg) {
      seg.classList.add('done');
      seg.classList.remove('active');
    });
    document.querySelectorAll('.clf-question').forEach(function(q) { q.classList.remove('active'); });

    var result = computeClassification();
    var resultEl = document.getElementById('clf-result');

    var deadlineHtml;
    if (result.deadline) {
      var days = daysUntil(result.deadline);
      if (days <= 0) {
        deadlineHtml =
          '<div>Enforcement</div>' +
          '<div class="clf-result-days">IN FORCE</div>' +
          '<div>since ' + result.deadlineLabel + '</div>';
      } else {
        deadlineHtml =
          '<div>Compliance deadline</div>' +
          '<div class="clf-result-days">' + days + ' days</div>' +
          '<div>until ' + result.deadlineLabel + '</div>';
      }
    } else {
      deadlineHtml =
        '<div>Deadline</div>' +
        '<div class="clf-result-days">\u2014</div>' +
        '<div>No mandatory deadline</div>';
    }

    var oblsHtml = result.obligations.map(function(o) {
      return '<div class="clf-result-obl">' + o + '</div>';
    }).join('');

    var suppHtml = '';
    if (result.supplementary.length > 0) {
      suppHtml =
        '<div class="clf-result-section">' +
          '<div class="clf-result-label">Additional Obligations</div>' +
          '<div class="clf-result-obligations">' +
            result.supplementary.map(function(s) { return '<div class="clf-result-obl">' + s + '</div>'; }).join('') +
          '</div>' +
        '</div>';
    }

    var penaltyHtml = '';
    if (result.penalty) {
      penaltyHtml =
        '<div class="clf-result-section">' +
          '<div class="clf-result-label">Maximum Penalty</div>' +
          '<div class="clf-result-obligations">' +
            '<div class="clf-result-obl">' + result.penalty + '</div>' +
            '<div class="clf-result-obl">SMEs and startups: same amounts but whichever is lower (Art. 99(6))</div>' +
          '</div>' +
        '</div>';
    }

    var continueBtn = '<button class="clf-result-continue" onclick="applyClassification(\'' + result.exposureMapping + '\')">Continue to Governance Assessment \u2192</button>';

    resultEl.innerHTML =
      '<div class="clf-result-header">' +
        '<div>' +
          '<div class="clf-result-cat">' + result.category + '</div>' +
          '<div class="clf-result-level">' + result.level + '</div>' +
          '<div class="clf-result-ref">' + result.articles + ' \u2014 Regulation (EU) 2024/1689</div>' +
        '</div>' +
        '<div class="clf-result-deadline">' + deadlineHtml + '</div>' +
      '</div>' +
      '<div class="clf-result-body">' +
        '<div class="clf-result-section">' +
          '<div class="clf-result-label">Obligations (' + result.obligations.length + ')</div>' +
          '<div class="clf-result-obligations">' + oblsHtml + '</div>' +
        '</div>' +
        suppHtml +
        penaltyHtml +
        '<div class="clf-result-actions">' +
          continueBtn +
          '<button class="clf-result-restart" onclick="restartClassifier()">\u21BB Reclassify</button>' +
        '</div>' +
      '</div>';
    resultEl.classList.add('visible');
  }

  window.clfSelectOption = function(stepIdx, optionId) {
    clfSelections[stepIdx] = optionId;
    document.querySelectorAll('#clf-step-' + stepIdx + ' .clf-opt').forEach(function(opt) {
      opt.classList.toggle('selected', opt.dataset.option === optionId);
    });
    var nextBtn = document.getElementById('clf-next');
    if (nextBtn) nextBtn.disabled = false;
  };

  window.clfNext = function() {
    var currentQ = CLF_QUESTIONS[clfCurrentStep];
    var selectedId = clfSelections[clfCurrentStep];
    if (!selectedId) return;

    var selectedOpt = currentQ.options.find(function(o) { return o.id === selectedId; });

    if (clfCurrentStep === 0 && selectedOpt && selectedOpt.terminates) {
      showProhibitedResult(selectedOpt);
      return;
    }

    if (clfCurrentStep < CLF_TOTAL_STEPS - 1) {
      clfCurrentStep++;
      renderClfStep();
    } else {
      showClassificationResult();
    }
  };

  window.clfBack = function() {
    if (clfCurrentStep > 0) {
      clfCurrentStep--;
      renderClfStep();
    }
  };

  window.applyClassification = function(exposureValue) {
    var dropdown = document.getElementById('cfg-exposure');
    if (dropdown) dropdown.value = exposureValue;
    var wrap = document.getElementById('classifier-wrap');
    if (wrap) wrap.classList.add('collapsed');
    if (typeof generateMatrix === 'function') generateMatrix();
  };

  window.skipClassifier = function() {
    var wrap = document.getElementById('classifier-wrap');
    if (wrap) wrap.classList.add('collapsed');
  };

  window.restartClassifier = function() {
    clfCurrentStep = 0;
    clfSelections = {};
    document.querySelectorAll('.clf-opt').forEach(function(opt) { opt.classList.remove('selected'); });
    renderClfStep();
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initClassifier);
  } else {
    initClassifier();
  }
})();
</script>

<script>
// ── DATA MODEL ──

const MATURITY_LEVELS = ['absent','adhoc','structured','continuous','embedded'];
const MATURITY_LABELS = { absent:'Absent', adhoc:'Ad Hoc', structured:'Structured', continuous:'Continuous', embedded:'Embedded' };
const EXPOSURE_LEVELS = ['low','moderate','elevated','high'];
const EXPOSURE_LABELS = { low:'Low', moderate:'Moderate', elevated:'Elevated', high:'High' };

// Weighted maturity scoring: Oversight 1.5, Monitoring 1.4, Documentation 1.0
// Minimum safeguard principle: if ANY dimension is Absent, overall maturity cannot exceed Ad Hoc.
// This prevents false confidence from averaging away a critical governance gap.
function computeWeightedMaturity(oversight, monitoring, documentation) {
  const dims = [oversight, monitoring, documentation];
  const hasAbsent = dims.some(d => d === 'absent');

  const raw = (
    MATURITY_LEVELS.indexOf(oversight) * 1.5 +
    MATURITY_LEVELS.indexOf(monitoring) * 1.4 +
    MATURITY_LEVELS.indexOf(documentation) * 1.0
  ) / (1.5 + 1.4 + 1.0);

  const idx = Math.round(Math.max(0, Math.min(4, raw)));
  const computed = MATURITY_LEVELS[idx];

  if (hasAbsent && MATURITY_LEVELS.indexOf(computed) > 1) return 'adhoc';
  return computed;
}

// Activation postures per cell [maturity][exposure]
const POSTURES = {
  absent: {
    low:      { action: 'Define Governance Scope',           hint: 'Map system boundaries & impact' },
    moderate: { action: 'Initiate Minimum Governance',       hint: 'Establish ownership & basic controls' },
    elevated: { action: 'Assign Risk Owner Immediately',     hint: 'Structure accountability before next cycle' },
    high:     { action: 'Intervene — Suspend or Constrain',  hint: 'Do not operate without oversight layer' },
  },
  adhoc: {
    low:      { action: 'Begin Light Structuring',           hint: 'Document existing practices' },
    moderate: { action: 'Define Repeatable Processes',       hint: 'Assign ownership, start documentation' },
    elevated: { action: 'Formalize Oversight Structure',     hint: 'Set roles, review cadence & escalation path' },
    high:     { action: 'Activate Formal Governance Now',    hint: 'Mandate human oversight at every decision point' },
  },
  structured: {
    low:      { action: 'Observe & Stabilize',               hint: 'Confirm coverage at periodic review' },
    moderate: { action: 'Define & Track Metrics',            hint: 'Build monitoring baseline' },
    elevated: { action: 'Activate Monitoring Cadence',       hint: 'Schedule regular review cycles' },
    high:     { action: 'Intensify Monitoring & Clarify Roles', hint: 'Define escalation path & decision authority' },
  },
  continuous: {
    low:      { action: 'Run Periodic Checks',               hint: 'Verify controls remain efficient' },
    moderate: { action: 'Optimize Coverage & Efficiency',    hint: 'Review scope against system changes' },
    elevated: { action: 'Track Performance & Detect Drift',  hint: 'Enable automated drift alerting' },
    high:     { action: 'Run Audit & Stress Test',           hint: 'Review bias signals & failure modes' },
  },
  embedded: {
    low:      { action: 'Maintain Standard Operations',      hint: 'No immediate action required' },
    moderate: { action: 'Maintain & Schedule Reassessment',  hint: 'Annual review against regulatory updates' },
    elevated: { action: 'Sustain & Verify Regulatory Alignment', hint: 'Check for scope or context changes' },
    high:     { action: 'Maintain Continuous Assurance',     hint: 'Commission external audit annually' },
  },
};

// Urgency index is a proportional heuristic reflecting regulatory exposure dominance
// over governance maturity. Exposure weight (1.6) exceeds maturity mitigation (0.8)
// because unmanaged risk scales faster than governance matures.
function getUrgency(maturity, exposure) {
  const mIdx = MATURITY_LEVELS.indexOf(maturity);
  const eIdx = EXPOSURE_LEVELS.indexOf(exposure);
  const score = eIdx * 1.6 - mIdx * 0.8;
  if (score >= 4.5) return 'critical';
  if (score >= 3)   return 'high';
  if (score >= 1.5) return 'moderate';
  if (score >= 0.5) return 'low';
  return 'minimal';
}

// 30-day target: move each dim up one level if not already embedded
function targetState(oversight, monitoring, documentation) {
  const up = (l) => {
    const i = MATURITY_LEVELS.indexOf(l);
    return MATURITY_LABELS[MATURITY_LEVELS[Math.min(4, i + 1)]];
  };
  return `Oversight: ${up(oversight)} · Monitoring: ${up(monitoring)} · Documentation: ${up(documentation)}`;
}

// Immediate action descriptions
const IMMEDIATE = {
  absent:     { elevated: 'Structure accountability before next operating cycle. Establish oversight layer prior to continued system use.', high: 'Suspend or constrain system operation until governance layer is in place.' },
  adhoc:      { elevated: 'Formalize roles and review cadence. Ensure escalation path is documented and tested.', high: 'Mandate human review at every model decision point immediately.' },
  structured: { elevated: 'Activate scheduled monitoring cadence. Assign metric ownership.', high: 'Escalate to senior oversight. Initiate intensive review cycle.' },
  continuous: { elevated: 'Enable automated drift alerting. Review performance against baseline.', high: 'Commission external audit. Test failure modes and bias signals.' },
  embedded:   { elevated: 'Verify regulatory alignment. Check for scope or context changes.', high: 'Engage external auditor for annual assurance review.' },
};

function getImmediateAction(maturity, exposure) {
  const m = IMMEDIATE[maturity];
  if (!m) return 'Review governance posture and assign accountable owner.';
  return m[exposure] || m['elevated'] || 'Review governance posture and assign accountable owner.';
}

// ── RENDER ──

function generateMatrix() {
  const name         = document.getElementById('cfg-name').value || 'AI System';
  const exposure     = document.getElementById('cfg-exposure').value;
  const oversight    = document.getElementById('cfg-oversight').value;
  const monitoring   = document.getElementById('cfg-monitoring').value;
  const documentation= document.getElementById('cfg-documentation').value;

  const maturity = computeWeightedMaturity(oversight, monitoring, documentation);
  const rawIdx = Math.round(Math.max(0, Math.min(4, (
    MATURITY_LEVELS.indexOf(oversight) * 1.5 +
    MATURITY_LEVELS.indexOf(monitoring) * 1.4 +
    MATURITY_LEVELS.indexOf(documentation) * 1.0
  ) / 3.9)));
  const guardrailApplied = [oversight, monitoring, documentation].some(d => d === 'absent') && rawIdx > 1;
  const focalPosture = POSTURES[maturity][exposure];
  const today = new Date().toLocaleDateString('en-GB', { year:'numeric', month:'long', day:'numeric' });

  // Build dim tag for each dimension
  function dimTag(label, level) {
    const isCritical = level === 'absent';
    return `<span class="dim-tag ${isCritical ? 'dim-critical' : 'dim-soft'}">${label}: ${MATURITY_LABELS[level]}</span>`;
  }

  // Exposure dot class
  function dotClass(exp) {
    return `dot-${exp}`;
  }

  // Build grid rows
  let gridRows = '';
  MATURITY_LEVELS.forEach((mat, mIdx) => {
    const isLastRow = mIdx === MATURITY_LEVELS.length - 1;
    const rowLit = mat === maturity;

    gridRows += `<div class="mat-h ${rowLit ? 'lit' : 'dim'} ${isLastRow ? 'row-last' : ''}">
      <div class="mat-level">${MATURITY_LABELS[mat]}</div>
      <div class="mat-bar bar-${mat}"></div>
    </div>`;

    EXPOSURE_LEVELS.forEach(exp => {
      const isFocal = mat === maturity && exp === exposure;
      const isDim   = !isFocal;
      const urgency = getUrgency(mat, exp);
      const posture = POSTURES[mat][exp];
      const colClass = `col-${exp}`;
      const lastClass = isLastRow ? 'row-last' : '';

      gridRows += `<div class="cell ${colClass} ${isDim ? 'dim' : ''} ${isFocal ? 'focal' : ''} ${lastClass}">
        ${isFocal ? '<div class="focal-pin"></div>' : `<div class="u-bar urg-${urgency}"></div>`}
        <div class="c-action">${posture.action}</div>
        <div class="c-tag">${posture.hint}</div>
      </div>`;
    });
  });

  const html = `
<div class="context-banner">
  <div>
    <div class="ctx-label">System under assessment</div>
    <div class="ctx-name">${name}</div>
  </div>
  <div class="ctx-right">
    <div class="ctx-label">Identified coordinates · ${today}</div>
    <div class="ctx-coords">Exposure: ${EXPOSURE_LABELS[exposure]}</div>
    <div class="ctx-dims">
      ${dimTag('Oversight', oversight)}
      ${dimTag('Monitoring', monitoring)}
      ${dimTag('Documentation', documentation)}
    </div>
    <div>
      <span class="ctx-badge">● Active position · Maturity: ${MATURITY_LABELS[maturity]}</span>
      ${guardrailApplied ? '<span class="ctx-safeguard" title="Overall maturity capped due to Absent dimension(s). A critical governance gap in any single dimension prevents a higher overall rating.">⚠ Minimum safeguard principle applied</span>' : ''}
    </div>
  </div>
</div>

<div class="page">
  <div class="report-logo">
    <img src="/assets/logo.png" alt="Hexis" width="80" height="44">
  </div>
  <div class="header">
    <div>
      <div class="brand">Hexis · Governance Activation Matrix</div>
      <div class="title">Risk Exposure × Governance Maturity</div>
      <div class="subtitle">Contextual view — system position highlighted</div>
    </div>
    <div class="version-tag">Hexis Methodology v1.0<br>February 2026</div>
  </div>

  <div class="matrix-connector">Position derived from the following governance coordinates:</div>
  <div class="axis-x-label">← Risk Exposure →</div>
  <div class="axis-y-wrap">
    <div class="axis-y-label">← Governance Maturity →</div>
    <div class="grid">
      <div class="corner"><span>maturity ↓ / exposure →</span></div>
      ${EXPOSURE_LEVELS.map(exp => `
        <div class="exp-h ${exp === exposure ? 'lit' : 'dim'}">
          <div class="exp-dot ${dotClass(exp)}"></div>
          <div class="exp-label">${EXPOSURE_LABELS[exp]}</div>
        </div>`).join('')}
      ${gridRows}
    </div>
  </div>

  <div class="callout">
    <div class="callout-stripe"></div>
    <div class="callout-inner">
      <div class="co-sec">
        <div class="co-label">Activation posture</div>
        <div class="co-val">${focalPosture.action}</div>
      </div>
      <div class="co-div"></div>
      <div class="co-sec">
        <div class="co-label">Immediate action required</div>
        <div class="co-val">${getImmediateAction(maturity, exposure)}</div>
      </div>
      <div class="co-div"></div>
      <div class="co-sec">
        <div class="co-label">30-day target state</div>
        <div class="co-val">${targetState(oversight, monitoring, documentation)}</div>
      </div>
    </div>
  </div>

  <div id="why-position-${exposure}-${maturity}" class="why-section">
    <div class="why-label">Why this position?</div>
    <div class="why-text" id="why-text-output">
      <span class="why-loading">Generating reasoning...</span>
    </div>
  </div>

  <div class="weight-note">
    Governance maturity dimensions are weighted according to regulatory impact priority
    (Oversight 1.5 · Monitoring 1.4 · Documentation 1.0). Overall maturity computed as
    weighted average${guardrailApplied ? '; <strong>minimum safeguard principle applied</strong> — one or more dimensions scored Absent, capping overall maturity at Ad Hoc to prevent false confidence' : ''}.
    Urgency index is a proportional heuristic reflecting regulatory exposure dominance over governance maturity.
    See <a href="/methodology/" style="color:inherit;text-decoration:underline;">hexis.center/methodology</a>.
  </div>

  <div class="footer">
    <div class="legend">
      <div class="leg-item"><div class="leg-dot dot-low" style="border:1px solid rgba(28,30,35,0.14)"></div>Low exposure</div>
      <div class="leg-item"><div class="leg-dot dot-moderate"></div>Moderate exposure</div>
      <div class="leg-item"><div class="leg-dot dot-elevated"></div>Elevated exposure</div>
      <div class="leg-item"><div class="leg-dot dot-high"></div>High exposure</div>
    </div>
    <div class="footnote">
      <strong style="font-size:9px;letter-spacing:0.06em;text-transform:uppercase;">Preliminary Governance Finding</strong><br>
      Activation postures are normative recommendations.<br>
      Not legal advice. Context-specific assessment required.<br>
      <a href="/methodology/" style="color:inherit;text-decoration:underline;">hexis.center/methodology</a>
      <div style="margin-top:6px;font-size:8px;opacity:0.55;">Generated via Hexis Contextual Matrix Generator &middot; ${today}</div>
    </div>
  </div>
</div>`;

  document.getElementById('report-output').innerHTML = html;
  // Populate "Why this position?" — rule-based now, API-ready
  updateWhySection(name, exposure, maturity, oversight, monitoring, documentation, guardrailApplied);
}

// ── WHY THIS POSITION — Rule-based engine (API-ready architecture) ──

// Regulatory signals per exposure level
const REG_SIGNALS = {
  high:     'Under EU AI Act Annex III, this system category is designated high-risk, requiring traceable oversight, human review mechanisms, and documented accountability chains.',
  elevated: 'Systems at this exposure level carry direct human impact. EU AI Act Article 14 mandates effective human oversight, and ISO/IEC 42001 requires documented governance accountability.',
  moderate: 'At moderate exposure, governance structures should be preventive rather than reactive. NIST AI RMF Govern function recommends defined roles and review cycles before incidents occur.',
  low:      'Low exposure reduces urgency but does not eliminate governance obligations. Foundational documentation and scope definition establish the baseline for future oversight.',
};

// Maturity gap descriptions
const MATURITY_GAP = {
  absent: 'No governance layer is currently in place. This creates an accountability vacuum where risk decisions are made without defined authority or review mechanisms.',
  adhoc:  'Governance exists but is reactive and person-dependent. Without repeatable processes, coverage is inconsistent and gaps emerge under operational pressure.',
  structured: 'Processes are defined but monitoring is not yet continuous. The system operates within a governance framework, but drift and emerging risks may go undetected between review cycles.',
  continuous: 'Monitoring is active but stress-tested infrequently. The governance posture is strong; remaining risk lies in edge cases and regulatory evolution.',
  embedded: 'Governance is deeply integrated. Ongoing obligation is to maintain alignment as the system, context, and regulatory environment evolve.',
};

// Dimension-specific flags
function getDimensionFlags(oversight, monitoring, documentation) {
  const flags = [];
  if (monitoring === 'absent') flags.push('The absence of monitoring creates operational blindness — the system cannot detect performance degradation, bias emergence, or drift in real time.');
  if (oversight === 'absent')  flags.push('Without a defined oversight structure, there is no accountable party to authorize decisions or respond to incidents.');
  if (documentation === 'absent') flags.push('Missing documentation undermines audit readiness and prevents regulators or reviewers from reconstructing decision logic.');
  return flags.join(' ');
}

function generateWhyText(name, exposure, maturity, oversight, monitoring, documentation, guardrailApplied) {
  const reg = REG_SIGNALS[exposure] || '';
  const gap = MATURITY_GAP[maturity] || '';
  const flags = getDimensionFlags(oversight, monitoring, documentation);
  const guardrailNote = guardrailApplied
    ? ' Note: overall maturity has been capped at Ad Hoc by the minimum safeguard principle — a critical governance gap in one or more dimensions prevents a higher rating despite partial coverage elsewhere.'
    : '';

  return [reg, gap, flags, guardrailNote].filter(Boolean).join(' ');
}

// API-ready architecture: swap generateWhyText() for API call when ready
// To enable: replace generateWhyText() call below with fetchWhyTextFromAPI()
// ── API ARCHITECTURE NOTE ──
// Browser-to-Anthropic direct calls are intentionally disabled in V1.
// Reasons: CORS restrictions, API key exposure, model string volatility.
// Correct V2 architecture:
//   Frontend  → POST /api/why  (no API key in browser)
//   Backend   → Anthropic API with:
//     headers: { 'x-api-key': process.env.ANTHROPIC_API_KEY, 'anthropic-version': '2023-06-01' }
//   Backend handles prompt construction, key rotation, model versioning.
// This pattern keeps the key server-side and makes model upgrades transparent to the frontend.

async function fetchWhyTextFromAPI(name, exposure, maturity, oversight, monitoring, documentation) {
  // V1: disabled — rule-based engine is authoritative
  // V2: replace this with:
  //   const res = await fetch('/api/why', { method:'POST',
  //     headers:{'Content-Type':'application/json'},
  //     body: JSON.stringify({ name, exposure, maturity, oversight, monitoring, documentation }) });
  //   const data = await res.json();
  //   return data.text || null;
  return null; // Falls through to rule-based engine
}

async function updateWhySection(name, exposure, maturity, oversight, monitoring, documentation, guardrailApplied) {
  const el = document.getElementById('why-text-output');
  if (!el) return;

  // Use API if available, fall back to rule-based
  let text = null;
  try {
    text = await fetchWhyTextFromAPI(name, exposure, maturity, oversight, monitoring, documentation);
  } catch(e) {}

  if (!text) {
    text = generateWhyText(name, exposure, maturity, oversight, monitoring, documentation, guardrailApplied);
  }

  el.innerHTML = text
    ? `<span>${text}</span>`
    : `<span class="why-error">Reasoning unavailable. Check hexis.center/methodology for manual interpretation.</span>`;
}

// Auto-generate on load
generateMatrix();
</script>
