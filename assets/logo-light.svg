<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" fill="none" role="img" aria-label="Hexis — Human &amp; Systems">
  <!-- H mark: two thin vertical bars centered at x=100, total mark width=52 (x74–x126) -->
  <rect x="74"  y="6"  width="8" height="46" fill="#F8F7F5"/>
  <rect x="118" y="6"  width="8" height="46" fill="#F8F7F5"/>
  <!-- Brass crossbar -->
  <rect x="82"  y="25" width="36" height="2" fill="#B2986C"/>
  <!-- Hairline rule — spans full wordmark width -->
  <line x1="20" y1="58" x2="180" y2="58" stroke="#F8F7F5" stroke-width="0.6" opacity="0.25"/>
  <!-- HEXIS wordmark: textLength forces exact width wider than H mark -->
  <text x="100" y="75"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="12" font-weight="700"
        letter-spacing="12"
        text-anchor="middle"
        textLength="140" lengthAdjust="spacing"
        fill="#F8F7F5">HEXIS</text>
  <!-- HUMAN &amp; SYSTEMS subtitle: even wider -->
  <text x="100" y="89"
        font-family="Arial, Helvetica, sans-serif"
        font-size="5" letter-spacing="3"
        text-anchor="middle"
        textLength="130" lengthAdjust="spacing"
        fill="#8A8884">HUMAN &amp; SYSTEMS</text>
</svg>
