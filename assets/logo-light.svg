<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" fill="none" role="img" aria-label="Hexis — Human &amp; Systems">
  <!-- H mark: two thin vertical bars, centered over wordmark -->
  <!-- Wordmark "HEXIS" at size 12 + letter-spacing 14 ≈ width ~140px, centered at x=100 -->
  <!-- H mark total width: bar_w=8, gap=36 → 52px, centered: x=74 to x=126 -->
  <rect x="74"  y="6"  width="8" height="46" fill="#F8F7F5"/>
  <rect x="118" y="6"  width="8" height="46" fill="#F8F7F5"/>
  <!-- Brass crossbar at ~45% height -->
  <rect x="82"  y="26" width="36" height="2" fill="#B2986C"/>
  <!-- Hairline rule -->
  <line x1="30" y1="58" x2="170" y2="58" stroke="#F8F7F5" stroke-width="0.6" opacity="0.28"/>
  <!-- HEXIS wordmark — wide tracking so wordmark > H mark -->
  <text x="100" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="700" letter-spacing="14" text-anchor="middle" fill="#F8F7F5">HEXIS</text>
  <!-- HUMAN &amp; SYSTEMS subtitle -->
  <text x="100" y="88" font-family="Arial, Helvetica, sans-serif" font-size="5.5" letter-spacing="4" text-anchor="middle" fill="#8A8884">HUMAN &amp; SYSTEMS</text>
</svg>
