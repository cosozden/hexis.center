<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 110" fill="none" role="img" aria-label="Hexis — Human &amp; Systems">
  <!-- H mark: two vertical bars (paper/light on dark bg) -->
  <rect x="72" y="10" width="16" height="58" fill="#F8F7F5"/>
  <rect x="132" y="10" width="16" height="58" fill="#F8F7F5"/>
  <!-- Brass crossbar -->
  <rect x="88" y="37" width="44" height="2.5" fill="#B2986C"/>
  <!-- Hairline rule -->
  <line x1="66" y1="74" x2="154" y2="74" stroke="#F8F7F5" stroke-width="0.75" opacity="0.35"/>
  <!-- HEXIS wordmark -->
  <text x="110" y="90" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" letter-spacing="7" text-anchor="middle" fill="#F8F7F5">HEXIS</text>
  <!-- HUMAN &amp; SYSTEMS subtitle -->
  <text x="110" y="104" font-family="Arial, Helvetica, sans-serif" font-size="6.5" letter-spacing="3.5" text-anchor="middle" fill="#8A8884">HUMAN &amp; SYSTEMS</text>
</svg>
